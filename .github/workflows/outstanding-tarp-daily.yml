name: Good2Go Daily Outstanding Tarps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: good2go-daily-outstanding-tarps
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Call protected tarp report endpoint
        env:
          TARP_ENDPOINT: ${{ secrets.TARP_REPORT_ENDPOINT }}
          TARP_SECRET: ${{ secrets.TARP_REPORT_CRON_SECRET }}
        run: |
          if [ -z "$TARP_ENDPOINT" ] || [ -z "$TARP_SECRET" ]; then
            echo "Missing scheduler configuration; no request sent."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 180 \
            -X POST \
            -H "x-tarp-cron-secret: $TARP_SECRET" \
            "$TARP_ENDPOINT")"

          echo "$response"

          python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and not d.get("skipped") else 1)' <<< "$response"
