name: PashLoc V1 isolated synthetic verification
on:
  pull_request:
    paths:
      - "backend/src/services/pashlocEnrollV1Crypto.ts"
      - "backend/src/pashlocIsolatedServer.ts"
      - "backend/src/routes/pashlocIsolated*.ts"
      - "backend/src/services/pashloc*.ts"
      - "backend/tsconfig.pashloc-isolated.json"
      - "backend/scripts/verifyPashlocIsolatedRouting.ts"
      - "backend/src/services/pashlocDeviceClaimV2.ts"
      - "backend/scripts/verifyPashlocEnrollV1Synthetic.ts"
      - "backend/src/services/pashlocRestrictedBrowserV1.ts"
      - "backend/scripts/verifyPashlocRestrictedBrowserV1.ts"
      - ".github/workflows/pashloc-v1-synthetic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-crypto:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck Navigator backend
        run: npx tsc -p tsconfig.pashloc-isolated.json
      - name: Run isolated HTTP boundary smoke tests
        run: npx tsx scripts/verifyPashlocIsolatedRouting.ts
      - name: Run V1 synthetic cryptographic acceptance
        run: npx tsx scripts/verifyPashlocEnrollV1Synthetic.ts
      - name: Run restricted browser boundary acceptance
        run: npx tsx scripts/verifyPashlocRestrictedBrowserV1.ts
