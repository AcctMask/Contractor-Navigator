name: Navigator PashLoc integration checks
on:
  pull_request:
    paths:
      - 'backend/src/services/pashloc*.ts'
      - 'backend/src/services/authService.ts'
      - 'backend/src/routes/auth.ts'
      - 'backend/sql/pashloc_mfa_navigator_default_off_schema.sql'
      - 'dashboard/src/**'
      - '.github/workflows/navigator-pashloc-integration-check.yml'
  push:
    branches:
      - engineering/navi45-production-mfa-gate-20261113
permissions:
  contents: read
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit --module commonjs --moduleResolution node --target es2020 --esModuleInterop --skipLibCheck src/routes/auth.ts src/services/authService.ts src/services/pashloc*.ts
        working-directory: backend
