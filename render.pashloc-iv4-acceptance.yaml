# Dedicated probe only; reuse existing private disposable database, never production.
services:
  - type: web
    name: navigator-pashloc-iv4-db-probe
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/AcctMask/Contractor-Navigator
    branch: engineering/navi45-production-mfa-gate-20261113
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npx tsx src/pashlocAcceptanceProbe.ts
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pashloc-iv-disposable-mfa-isolated-20261113
          property: connectionString
      - key: NODE_ENV
        value: test
      - key: PASHLOC_ACCEPTANCE_DATABASE_NAME
        value: pashloc_iv_disposable_mfa_isolated
