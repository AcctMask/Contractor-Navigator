# Isolated, disposable MFA acceptance infrastructure only.
# Separate resources; never adopt or mutate the production services.
databases:
  - name: pashloc-iv4-acceptance-db
    databaseName: pashloc_iv4_acceptance_disposable
    user: pashloc_iv4_acceptance_user
    plan: free
    region: virginia
    ipAllowList: []
services:
  - type: web
    name: navigator-pashloc-iv4-db-probe
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/AcctMask/Contractor-Navigator
    branch: engineering/navi45-production-mfa-gate-20261113
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npx tsx src/pashlocAcceptanceProbe.ts
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pashloc-iv4-acceptance-db
          property: connectionString
      - key: NODE_ENV
        value: test
      - key: PASHLOC_ACCEPTANCE_DATABASE_NAME
        value: pashloc_iv4_acceptance_disposable
